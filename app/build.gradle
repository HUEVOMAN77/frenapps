plugins {
    id 'com.android.application'
}

// La firma de release vive fuera del repo (GPL y claves personales). Si no esta el
// archivo, el build sale igual pero firmado con la clave de debug.
def forkKeystoreProps = new Properties()
def forkKeystorePropsFile = rootProject.file('keystore/frenapps.properties')
if (forkKeystorePropsFile.exists()) {
    forkKeystoreProps.load(new FileInputStream(forkKeystorePropsFile))
}

android {
    namespace 'com.northmendo.Appzuku'
    compileSdk 36

    signingConfigs {
        if (forkKeystorePropsFile.exists()) {
            fork {
                storeFile rootProject.file(forkKeystoreProps.getProperty('storeFile'))
                storePassword forkKeystoreProps.getProperty('storePassword')
                keyAlias forkKeystoreProps.getProperty('keyAlias')
                keyPassword forkKeystoreProps.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId "com.northmendo.Appzuku"
        minSdk 23
        targetSdk 36
        versionCode 23
        versionName "1.3.17-fork.2"
        multiDexEnabled = true
        vectorDrawables {
            useSupportLibrary true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"  : "true",
                        "room.expandProjection": "true"
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig forkKeystorePropsFile.exists() ? signingConfigs.fork
                    : signingConfigs.debug
        }
    }
    
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation("androidx.constraintlayout:constraintlayout:2.2.1")
    implementation("com.google.android.material:material:1.13.0")
    implementation("dev.rikka.shizuku:api:12.1.0")
    implementation("dev.rikka.shizuku:provider:12.1.0")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.2.0")

    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // WorkManager
    def work_version = "2.11.1"
    implementation "androidx.work:work-runtime:$work_version"
}

